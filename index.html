<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHESS Mockup</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-bar">
  <div class="brand">
    <div class="brand-logo">CHESS</div>
    <div class="brand-sub">GEOPOLITICAL INTELLIGENCE</div>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-view="chat">CHAT</button>
    <button class="nav-tab" data-view="explore">EXPLORE</button>
    <button class="nav-tab" data-view="dashboard">DASHBOARD</button>
    <button class="nav-tab" data-view="admin">ADMIN</button>
  </nav>
  <div class="user-block">
    <div class="user-avatar">GD</div>
    <div class="user-info">
      <div class="user-name">G. Di Filippo</div>
      <div class="user-role">ANALYST</div>
    </div>
  </div>
</header>

<div class="view active" data-view="chat">
  <aside class="chat-panel">
    <div class="chat-panel-hdr">
      <div>
        <div class="panel-title">SESSION</div>
        <div class="panel-subtitle" id="chat-subtitle">Session &middot; new</div>
      </div>
      <div class="chat-panel-actions">
        <button class="chat-icon-btn" id="new-chat-btn" title="New chat">&#9998;</button>
        <button class="chat-icon-btn" title="Archive">&#9114;</button>
      </div>
    </div>
    <div class="breadcrumb" id="breadcrumb">
      <span id="bc-dossier"></span> <span id="bc-actors"></span> <span id="bc-reports"></span>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div class="chat-input-wrap">
      <textarea class="chat-input" id="chat-input" placeholder="Ask about actors, arcs, scenarios..." rows="1"></textarea>
      <button class="run-btn" id="run-btn">RUN &rarr;</button>
    </div>
    <div class="input-hint" id="input-hint">Answer first &middot; Deep-Think from the report if needed</div>
  </aside>

  <main class="center-panel" id="center-panel"></main>

  <aside class="intel-panel hidden" id="intel-panel"></aside>
</div>

<div class="view" data-view="explore">
  <div class="explore-hdr">
    <div class="ctx-tag">EXPLORE</div>
    <h1>Knowledge <em>base</em></h1>
    <div class="sub-tabs">
      <button class="sub-tab active" data-sub="news">News</button>
      <button class="sub-tab" data-sub="analyses">Specialized analyses</button>
      <button class="sub-tab" data-sub="primary">Primary sources</button>
      <button class="sub-tab" data-sub="structured">Structured data</button>
      <button class="sub-tab" data-sub="sources">Sources</button>
    </div>
  </div>
  <div class="explore-body" id="explore-body"></div>
</div>

<div class="view" data-view="dashboard">
  <div class="dashboard-shell" id="dashboard-shell"></div>
</div>

<div class="view" data-view="admin">
  <aside class="admin-nav">
    <div class="admin-nav-title">ADMIN</div>
    <button class="admin-nav-item active" data-admin="sources">Sources</button>
    <button class="admin-nav-item" data-admin="users">Users &amp; permissions</button>
    <button class="admin-nav-item" data-admin="kg">KG type registry</button>
    <button class="admin-nav-item" data-admin="pipelines">Ingestion pipelines</button>
    <button class="admin-nav-item" data-admin="alerts">Alerts &amp; thresholds</button>
    <button class="admin-nav-item" data-admin="logs">System logs</button>
  </aside>
  <main class="admin-main" id="admin-main"></main>
</div>

<footer class="footer" id="footer">
  <div class="footer-left">CHESS &middot; DEMO BUILD v3.0</div>
  <div class="footer-right" id="footer-right"></div>
</footer>

<div class="full-report-overlay" id="full-report-overlay">
  <div class="fro-inner">
    <div class="fro-header">
      <div class="fro-title" id="fro-title"></div>
      <button class="fro-close" id="fro-close">&times;</button>
    </div>
    <div class="fro-body">
      <div class="fro-lattice-wrap">
        <svg id="fro-lattice-svg" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="fro-narrative" id="fro-narrative"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
